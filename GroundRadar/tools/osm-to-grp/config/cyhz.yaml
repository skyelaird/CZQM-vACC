# CYHZ — Halifax Stanfield International
# Config for the OSM-to-GRP extractor. Edit and re-run extract.py to regenerate.

icao: CYHZ
display_name: Halifax Stanfield

# Overpass bounding box (degrees)
bbox:
  lat_min: 44.846
  lon_min: -63.617
  lat_max: 44.906
  lon_max: -63.458

# Local projection origin for buffering. Set to airport ARP latitude.
projection_lat: 44.881

# Default widths (meters) used to buffer centerline ways where we still buffer
# (helipad node radius, parking lead-ins, etc). Runway/taxiway pavement now comes
# from the .sct's hand-drawn REGIONS via SCTFILEDATA — buffering not used there.
default_widths:
  parking_position: 30.0

# How many vertices a 'runway'-tagged way must have to count.
# OSM has a stray 3-vertex duplicate fragment of 05/23 — this filters it.
min_runway_vertices: 5

# Output paths (relative to repo root: D:\GitHub\CZQM-vACC\)
output:
  maps: GroundRadar/CYHZ/GRpluginMaps.txt
  settings: GroundRadar/CYHZ/GRpluginSettings.txt
  stands: GroundRadar/CYHZ/GRpluginStands.txt

# Stand definitions for occupancy detection (auto-assignment is disabled globally).
# Each OSM-derived ref becomes one STAND line. Radius is derived from the stand's
# ICAO Aerodrome Reference Code (ARC) category via category_radius below.
stands:
  default_category: C          # Fallback for stands not listed in stand_categories
  auto_assign_dist_nm: 0       # 0 disables auto-assignment; occupancy detection still works
  heading_tolerance_deg: 30    # Tolerance applied to HEADING: line in each STAND entry
  gsx_profile: '%APPDATA%\Virtuali\GSX\MSFS\CYHZ-nil2jfkk.ini'   # real stop positions + headings override OSM gate nodes
  radius_limit_half_spacing: true   # detection circle <= half distance to nearest stand
  min_radius_m: 8.0
  infer_missing_from_gsx: true      # stands GSX lacks: shift like the 2 nearest GSX stands (GSX only has MSFS spawn spots)
  infer_max_neighbour_m: 120
  default_use: A                    # airliners unless stand_use says otherwise

# Per-stand heading (degrees true 0-360) for STAND occupancy disambiguation.
# Stands not listed fall back to OSM parking_position way last-segment bearing,
# else no HEADING line emitted (detection still works, just without orientation constraint).
#
# Values below were extracted ONCE (2026-05-16) from GSX profile
# CYHZ-nil2jfkk.ini (Joel-edited). Re-extract manually if the underlying GSX
# profile is revised significantly.
stand_headings:
  "3":   325.1
  "5":    11.1
  "6":    10.6
  "7":   317.0
  "8":   267.6
  "9":   230.3
  "12":  259.7
  "14":  269.1
  "15":  302.2
  "16":  259.9
  "18":  260.2
  "20":  284.7
  "22":  296.6
  "23":  260.2
  "24":  239.3
  "27":  215.2
  "28":  215.1
  "36":  125.0
  "38":  127.5
  "42":  127.0
  "46":  185.8

# Radius per ICAO ARC code letter (matches GRP's MAXCODE / Airport_Runway_MaxCode vocabulary).
# wingspan ranges: A<15, 15<=B<24, 24<=C<36, 36<=D<52, 52<=E<65, 65<=F<80
category_radius:
  A: 10.0    # light GA — C172, Bonanza
  B: 14.0    # KingAir, ATR-42, CRJ-100
  C: 20.0    # CRJ-900, E-jets, 737, A320 family
  D: 28.0    # 757, A321neo, 767, A310
  E: 35.0    # 777, A330, A340
  F: 42.0    # A380, 747-8

# Per-stand category. GSX-known stands pre-populated from CYHZ-nil2jfkk.ini wingspans.
# Stands without an entry default to category_radius[stands.default_category].
# F-class entries from GSX may be permissive — gate 15 is the legitimate wide-body
# stand at CYHZ; 22/24/27 may be operationally E or even D in practice.
stand_categories:
  # GSX-defined (extracted from CYHZ-nil2jfkk.ini)
  "3":   C    # 28m wingspan
  "5":   C    # 28m
  "6":   C    # 28m
  "7":   B    # from live stands file (hand-set) 2026-10-23
  "8":   B    # from live stands file (hand-set) 2026-10-23
  "9":   B    # from live stands file (hand-set) 2026-10-23
  "12":  C    # from live stands file (hand-set) 2026-10-23
  "14":  C    # from live stands file (hand-set) 2026-10-23
  "15":  E    # Joel 2026-10-23: E (A330/777 class), not F
  "16":  C    # from live stands file (hand-set) 2026-10-23
  "18":  C    # from live stands file (hand-set) 2026-10-23
  "20":  C    # from live stands file (hand-set) 2026-10-23
  "22":  C    # Joel 2026-10-23: C (narrowbody); widebodies use 27/28
  "23":  C    # Joel 2026-10-23: C (narrowbody); widebodies use 27/28
  "24":  C    # Joel 2026-10-23: C (narrowbody); widebodies use 27/28
  "27":  E    # Joel 2026-10-23: widebody stand
  "28":  C    # Joel 2026-10-23: C (27 is the E stand)
  "36":  C    # Joel 2026-10-23: Dash 8
  "38":  C    # Joel 2026-10-23: Dash 8
  "42":  C    # Joel 2026-10-23: Dash 8
  "46":  C    # Joel 2026-10-23: Dash 8
  # OSM-only stands — defaulted per reasonable assumption; verify and adjust
  "4":   C    # Terminal 1 numbered — likely C
  "10":  B    # from live stands file (hand-set) 2026-10-23
  "26":  E    # from live stands file (hand-set) 2026-10-23
  "2A":  C    # Joel 2026-10-23: small twin airline (Dash 8 / ATR class)
  "2B":  C    # Joel 2026-10-23: small twin airline (Dash 8 / ATR class)
  "2C":  C    # Joel 2026-10-23: small twin airline (Dash 8 / ATR class)
  "2D":  C    # Joel 2026-10-23: small twin airline (Dash 8 / ATR class)
  "2E":  C    # Joel 2026-10-23: small twin airline (Dash 8 / ATR class)
  "34":  C    # Joel 2026-10-23: Dash 8
  "40":  C    # Joel 2026-10-23: Dash 8
  "44":  C    # Joel 2026-10-23: Dash 8
  "301": F    # Joel 2026-10-23: Cargo Ramp 3 - cargo + military; F as the only F-capable area (USE:CMT set in live stands file)
  "302": F    # Joel 2026-10-23: Cargo Ramp 3 - cargo + military; F as the only F-capable area (USE:CMT set in live stands file)
  "303": F    # Joel 2026-10-23: Cargo Ramp 3 - cargo + military; F as the only F-capable area (USE:CMT set in live stands file)
  "304": F    # Joel 2026-10-23: Cargo Ramp 3 - cargo + military; F as the only F-capable area (USE:CMT set in live stands file)
  "305": F    # Joel 2026-10-23: Cargo Ramp 3 - cargo + military; F as the only F-capable area (USE:CMT set in live stands file)
  "306": F    # Joel 2026-10-23: Cargo Ramp 3 - cargo + military; F as the only F-capable area (USE:CMT set in live stands file)
  "307": F    # Joel 2026-10-23: Cargo Ramp 3 - cargo + military; F as the only F-capable area (USE:CMT set in live stands file)
  "308": F    # Joel 2026-10-23: Cargo Ramp 3 - cargo + military; F as the only F-capable area (USE:CMT set in live stands file)
  "308F": F    # freighter alternate (extra_stands)


# Stand use (GRP USE codes: A airline, B business, C cargo, H heli, I mil heli, M military, P private, T mil tanker/transport)
stand_use:
  "301": CMT    # Cargo Ramp 3 - cargo + military
  "302": CMT
  "303": CMT
  "304": CMT
  "305": CMT
  "306": CMT
  "307": CMT
  "308": CMT
  "308F": CT

# BLOCKS: when this stand is used, the listed stands are blocked
stand_blocks:
  "2C": "2B,2D"
  "308F": "307,308"
  # Dash 8 row: 34/40/44 are alternates sitting between the regular stands (Joel 2026-10-23)
  "34": "36,38"
  "36": "34"
  "38": "34,40"
  "40": "38,42"
  "42": "40,44"
  "44": "42,46"
  "46": "44"

# STANDLIST lines (Icao:CallsignList:Points:StandList) - preference lists for later auto-assignment
standlists:
  - "CYHZ:FDX,MAL,CDX,KAL,UPS:0:301,302,303,304,305"

# Position overrides (applied after GSX/inference). "between" = midpoint of two stands.
stand_positions:
  "34": { between: "36,38" }    # alternate
  "40": { between: "38,42" }    # alternate
  "44": { between: "42,46" }    # alternate

# Stands not in OSM
extra_stands:
  "308F": { lat: 44.8709744, lon: -63.5335519 }    # freighter alternate spanning 307/308

# SCTFILEDATA source — the AeroNav sector file with the hand-drawn CYHZ surface
# geometry. Path is emitted as-is into GRpluginMaps.txt as SCTFILEPATH.
# GRP resolves it relative to its plugin DLL folder, or accepts absolute.
# For local development against the repo copy.
# NOTE: trailing '*' (no extension) per Developer Guide §3.2 — the plugin
# implicitly looks for '.sct' files and picks the alphabetically-last match.
# A '*.sct' suffix is interpreted as a literal filename and fails to resolve.
sct_file_path: 'D:\GitHub\CZQM-vACC\GroundRadar\reference docs\CZQQ-CZQM-CZQX_*'
# For production install once the .sct is alongside the plugin:
#   sct_file_path: '..\Sector\CZQQ-CZQM-CZQX_*'

# Names of the .sct GEO and FREETEXT groups for CYHZ. Used by SCTFILEDATA lines.
sct_groups:
  geo_surface: 'CYHZ Groundlayout Halifax'
  geo_surface_lvp: 'CYHZ Groundlayout Halifax - low vis'
  geo_parking: 'CYHZ Groundlayout Halifax Parking'
  regions: 'CYHZ Halifax'
  freetext_parking: 'CYHZ CYHZ PARKING'
  freetext_taxiway: 'CYHZ CYHZ TAXIWAY'

# Apron sub-types — OSM way IDs mapped to a category.
# Each category emits its own MAP block painted over the default .sct apron rendering.
apron_categories:
  cargo:
    color: SMGS_CARGO_APRON
    osm_ids:
      - 878197441
  # helicopter:
  #   color: SMGS_HELI_APRON
  #   osm_ids: []

# Airport metadata for [CYHZ] settings block
airport:
  elevation_ft: 477
  radius_nm: 1.3                       # See grp-capability-analysis.md §9 Q7 — sized to ARP-to-furthest-corner
  sct_arp_lat: N044.52.46.858          # From .sct [AIRPORT] section line 5126
  sct_arp_lon: W063.30.36.691

# Runway thresholds — from CZQQ AIRAC 2605/1 [RUNWAY] section (authoritative)
runways:
  "05/23":
    width_m: 63                        # OSM tag matches CYHZ AIP 200ft = ~60m
    end_a: { id: "05", lat: N044.51.56.318, lon: W063.31.38.110, hdg: 53 }
    end_b: { id: "23", lat: N044.53.18.250, lon: W063.30.17.200, hdg: 233 }
  "14/32":
    width_m: 63
    end_a: { id: "14", lat: N044.53.37.388, lon: W063.31.02.769, hdg: 143 }
    end_b: { id: "32", lat: N044.52.53.691, lon: W063.29.35.278, hdg: 323 }

# Runway-area dims (meters) — LPPT uses 45.0 normal / 90.0 LVP for area, 90/140 for buffer
runway_area:
  normal_m: 45.0
  normal_buffer_m: 90.0
  lvp_m: 90.0
  lvp_buffer_m: 140.0

# APM (Approach Path Monitoring) — straight-in 3° approaches to each runway end.
# end_lat/end_lon and true inbound course are derived at run time from the
# runway-pair geometry in `runways:` above. dir is the side the approach is drawn
# in the AppPath Window ("L" or "R"). end_alt = airport elevation in ft AMSL.
app_paths:
  - { name: "RNAV 05", rwy: "05", dir: R, end_alt: 477, vert: 3.0 }
  - { name: "RNAV 23", rwy: "23", dir: L, end_alt: 477, vert: 3.0 }
  - { name: "RNAV 14", rwy: "14", dir: R, end_alt: 477, vert: 3.0 }
  - { name: "RNAV 32", rwy: "32", dir: L, end_alt: 477, vert: 3.0 }
# APM activation range and gates (single set applied to all paths above)
apm:
  alerts: ABL                          # A=above, B=below, L=lateral
  range_min_nm: 0.5
  range_max_nm: 5.0
  vert_join_alt: 200                   # no below-path alerts above this AAL (ft)
  vert_overfly_alt: 5000               # no above-path alerts above this (ft)

# Safety nets — match the GRP capability analysis recommendations.
# 1=enabled-visible, 0=disabled-but-button-visible, -1=disabled-and-hidden
safety_nets:
  APM: 1
  APW: 1
  CBM: 1
  ECM: 1
  ICM: 1
  OSM: 1                               # Stand occupancy monitoring enabled (assignment auto-disabled by System_AutoAssignDist=0)
  RIM: 1
  RUM: 1
  RVM: -1                              # No published CYHZ taxiway restrictions; hide button

# Colour palette (RGB). LPPT-inspired dark variant, starting point for Phase 4 polish.
# Note: when SCTFILEDATA pulls REGIONS, the .sct's own COLOR_* values are used
# (we just have to make sure the .sct's COLORs render acceptably). The SMGS_* names
# below are used by our own overlay MAP blocks (apron categories, helipad, etc.)
colors:
  SMGS_BACKGROUND:    [150, 150, 150]
  SMGS_APRON:         [115, 125, 125]    # baseline override colour for any apron MAP block we author ourselves
  SMGS_CARGO_APRON:   [100, 115, 130]    # cooler tint to distinguish cargo
  SMGS_HELI_APRON:    [125, 110, 110]    # warmer tint for helicopter ramps (when identified)
  SMGS_BUILDING:      [60, 60, 55]
  SMGS_PARKING:       [110, 115, 115]    # parking lead-in lines
  SMGS_HOLDING:       [200, 165, 60]     # holding-position / stop-bar marking
  SMGS_HELI:          [120, 100, 100]    # helipad fill for node-form helipads
  SMGS_LABEL:         [200, 200, 200]    # text labels not from .sct

# Manual overrides for known-bad OSM tagging.
# Maps OSM element ID -> corrected aeroway value.
osm_overrides:
  11810432109: helipad   # node, tagged parking_position in OSM but is actually a helipad
  11810432123: helipad   # node, tagged holding_position in OSM but is actually a helipad

# Helipad rendering parameters (node-form helipads)
helipad:
  radius_m: 12.0
